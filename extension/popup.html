<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Prompt Library</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="popup.js"></script>
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.5l-5.7 3 1.1-6.3-4.6-4.5 6.4-.9Z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l5-1L20 8a2.8 2.8 0 0 0-4-4L5 15Z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 17v4h16v-4"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m9 10 6-4M9 14l6 4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 3h14v18l-7-4-7 4Z"/><path d="M9 7h6M9 10h4"/></symbol>
  </defs></svg>
  <main id="app" class="app">
    <header class="main-header">
      <div class="brand"><img class="brand-mark" src="icons/icon.svg" width="38" height="38" alt=""><h1>Prompt Library</h1></div>
      <div class="header-actions"><button id="add-prompt" class="icon-button add-button" type="button" aria-label="Add prompt"><svg><use href="#i-plus"/></svg></button><button id="open-settings" class="icon-button" type="button" aria-label="Settings"><svg><use href="#i-settings"/></svg></button></div>
    </header>
    <div class="search-wrap"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search titles, tags, and prompts" aria-label="Search titles, tags, and prompts"><kbd id="search-key">/</kbd><button id="clear-search" class="icon-button" hidden type="button" aria-label="Clear search"><svg><use href="#i-close"/></svg></button></div>
    <nav id="filters" class="filters" aria-label="Filters"></nav>
    <div class="list-heading"><span id="result-count" aria-live="polite"></span><div class="list-controls"><span id="sort-label"></span><button id="favorites-filter" class="icon-button favorites-filter" type="button" aria-label="Favorites" aria-pressed="false"><svg aria-hidden="true"><use href="#i-star"/></svg></button></div></div>
    <section id="prompt-list" class="prompt-list" aria-label="Prompts" aria-busy="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
    <footer class="main-footer"><span class="footer-brand">PROMPT LIBRARY <span>01</span></span><span id="keyboard-hint"></span></footer>
    <section id="panel" class="panel" aria-modal="true" role="dialog" aria-labelledby="panel-title" hidden></section>
    <div id="toast" role="status" class="toast" hidden></div>
    <div id="confirmation" class="confirmation" hidden></div>
  </main>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
</body>
</html>
